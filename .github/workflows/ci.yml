name: Run PHP Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        php-version: [8.4]
        include:
          - php-version: '8.4'

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug
          extensions: mbstring, intl

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit --configuration phpunit.xml --coverage-clover coverage.xml

      - name: Generate Coverage Badge
        if: github.ref == 'refs/heads/master'
        run: |
          COVERAGE=$(php -r '$xml = simplexml_load_file("coverage.xml"); $metrics = $xml->project->metrics; $covered = (int)$metrics["coveredelements"]; $total = (int)$metrics["elements"]; echo $total > 0 ? round(($covered / $total) * 100) : 0;')
          if [ "$COVERAGE" -ge 80 ]; then COLOR="green"; elif [ "$COVERAGE" -ge 50 ]; then COLOR="yellow"; else COLOR="red"; fi
          mkdir -p badges
          curl "https://img.shields.io/badge/coverage-$COVERAGE%25-$COLOR" > badges/coverage.svg

      - name: Deploy Coverage Badge
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: badges
          publish_branch: badges
          force_orphan: true
